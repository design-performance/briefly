  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

--accent-25: #fff1ea;\n  --accent-100: #ffd9c2;\n  --accent-300: #ff9a63;\n  --accent-500: #ff5a1f;  /* primary accent */\n  --accent-600: #e2470f;\n  --accent-700: #b8380c;\n  --accent-900: #5c1c06;\n\n  /* ---- Semantic feedback (minimal, used only in form/system states) ---- */\n  --success-500: #1f8f5f;\n  --success-100: #dcf1e6;\n  --danger-500: #d3401f;\n  --danger-100: #fbe2da;\n\n  /* ---- Semantic aliases ---- */\n  --bg-page: var(--gray-25);\n  --bg-page-inverse: var(--gray-900);\n  --bg-surface: var(--gray-0);\n  --bg-surface-inverse: var(--gray-800);\n  --bg-sunken: var(--gray-50);\n  --bg-overlay: rgba(14, 13, 12, 0.72);\n\n  --border-default: var(--gray-200);\n  --border-strong: var(--gray-900);\n  --border-inverse: rgba(255, 255, 255, 0.16);\n  --border-accent: var(--accent-500);\n\n  --text-primary: var(--gray-900);\n  --text-secondary: var(--gray-500);\n  --text-tertiary: var(--gray-300);\n  --text-inverse: var(--gray-25);\n  --text-inverse-secondary: rgba(247, 246, 243, 0.64);\n  --text-accent: var(--accent-600);\n  --text-on-accent: var(--gray-950);\n\n  --accent-primary: var(--accent-500);\n  --accent-primary-hover: var(--accent-600);\n  --accent-primary-press: var(--accent-700);\n  --accent-tint: var(--accent-25);\n\n  --focus-ring: var(--accent-500);\n}\n\n/* Joander Santos — Typography tokens */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Space Grotesk', 'Arial Narrow', sans-serif;   /* headlines, wordmark, big numerals */\n  --font-body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; /* paragraphs, UI copy */\n  --font-eyebrow: 'Newsreader', Georgia, serif;   /* italic serif accent — small labels/eyebrows only */\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace; /* tags, meta, code, timestamps */\n\n  /* ---- Display / headline scale ---- */\n  --text-display-xl: 700 5rem/0.98 var(--font-display);\n  --text-display-lg: 700 3.5rem/1.0 var(--font-display);\n  --text-display-md: 600 2.5rem/1.05 var(--font-display);\n  --text-display-sm: 600 1.5rem/1.15 var(--font-display);\n\n  /* Fluid sizes for the same steps — apply via font-size only, pair with the shorthand above for weight/family/line-height */\n  --size-display-xl: clamp(2.75rem, 2rem + 3.2vw, 5.5rem);\n  --size-display-lg: clamp(2.25rem, 1.7rem + 2.4vw, 4rem);\n  --size-display-md: clamp(1.75rem, 1.4rem + 1.4vw, 2.75rem);\n\n  /* ---- Body scale ---- */\n  --text-body-lg: 400 1.25rem/1.55 var(--font-body);\n  --text-body-md: 400 1.0625rem/1.6 var(--font-body);\n  --text-body-sm: 400 0.9375rem/1.55 var(--font-body);\n  --text-body-xs: 400 0.8125rem/1.5 var(--font-body);\n\n  /* ---- Eyebrow / accent italic ---- */\n  --text-eyebrow-md: italic 500 1.125rem/1.3 var(--font-eyebrow);\n  --text-eyebrow-sm: italic 500 0.9375rem/1.3 var(--font-eyebrow);\n\n  /* ---- Mono / label scale ---- */\n  --text-mono-md: 500 0.875rem/1.4 var(--font-mono);\n  --text-mono-sm: 500 0.75rem/1.4 var(--font-mono);\n  --text-label: 500 0.75rem/1 var(--font-mono);\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.03em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-label: 0.08em;\n}\n\n/* Joander Santos — Spacing, radius, shadow, motion tokens */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---- Radius ---- */\n  --radius-sm: 6px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---- Shadow (soft, single low-angle light source; no color tint) ---- */\n  --shadow-xs: 0 1px 2px rgba(14, 13, 12, 0.06);\n  --shadow-sm: 0 2px 8px rgba(14, 13, 12, 0.08);\n  --shadow-md: 0 8px 24px rgba(14, 13, 12, 0.10);\n  --shadow-lg: 0 20px 48px rgba(14, 13, 12, 0.14);\n  --shadow-inverse-sm: 0 2px 8px rgba(0, 0, 0, 0.4);\n\n  /* ---- Border widths ---- */\n  --border-thin: 1px;\n  --border-thick: 1.5px;\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 420ms; /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"5885be3e-a38c-422c-b566-c1fca71603a4\"><\u002Fscript>\n  <style>\n    html { scroll-behavior: smooth; }\n    body { margin: 0; background: #f7f6f3; color: #0e0d0c; font-family: 'IBM Plex Sans', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }\n    h1, h2, h3, p { margin: 0; }\n    a { color: inherit; text-decoration: none; } a:hover { color: inherit; }\n    @keyframes jsFoco { from { opacity: 0; filter: blur(16px); transform: translate3d(0, 0.45em, 0) rotateX(-50deg); } to { opacity: 1; filter: blur(0); transform: none; } }\n    @keyframes jsCarta { from { opacity: 0; filter: blur(22px); transform: perspective(1400px) rotateY(-30deg) rotateX(12deg) translate3d(80px, 40px, -320px); } to { opacity: 1; filter: blur(0); transform: none; } }\n    @keyframes jsSobe { from { opacity: 0; filter: blur(10px); transform: translate3d(0, 24px, 0); } to { opacity: 1; filter: blur(0); transform: none; } }\n    @keyframes jsOnda { 0%, 100% { filter: blur(0); opacity: 1; transform: translate3d(0, 0, 0); } 45% { filter: blur(16px); opacity: 0.55; transform: translate3d(0, -0.035em, 0) scale(1.03); } 60% { filter: blur(4px); opacity: 0.9; } }\n    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position: fixed; top: 16px; left: 0; right: 0; z-index: 50; display: flex; justify-content: center; padding: 0 12px; pointer-events: none;\">\n  <nav style=\"pointer-events: auto; display: flex; align-items: center; gap: 2px; backgr  Sobre mim<\u002Fp>\n      <h2 style=\"font: 700 clamp(2.2rem, 1.4rem + 3vw, 3.6rem)/1.02 'Space Grotesk', sans-serif; letter-spacing: -0.04em;\">Sou Joander. <span style=\"color: #a9a69d;\">Designer de experiências digitais.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 18px; align-items: flex-start;\">\n      <div data-k=\"0.15,0.45\" style=\"display: flex; flex-direction: column; gap: 18px; align-items: flex-start; opacity: var(--k, 1); filter: blur(calc((1 - var(--k, 1)) * 10px)); transform: translate3d(0, calc((1 - var(--k, 1)) * 36px), 0);\">\n        <p style=\"font: 400 18px/1.7 'IBM Plex Sans', sans-serif; color: #0e0d0c; text-wrap: pretty;\">Trabalho onde design e tecnologia se encontram. Projeto sites, interfaces e sistemas digitais, transformando necessidades complexas em experiências simples, funcionais e consistentes.<\u002Fp>\n        <p style=\"font: 400 16px/1.7 'IBM Plex Sans', sans-serif; color: #66635c; text-wrap: pretty;\">São mais de 6 anos de projeto, com clientes como Unimed e PopVita. Meu trabalho vai do conceito à implementação, e é por isso que o Briefly e o Gestor de Eventos existem.<\u002Fp>\n        <a href=\"curriculo.html\" style=\"display: inline-flex; padding: 13px 22px; border-radius: 999px; border: 1px solid #0e0d0c; font: 600 14px 'IBM Plex Sans', sans-serif; white-space: nowrap;\" style-hover=\"background: #0e0d0c; color: #f7f6f3\">Ver currículo completo →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; perspective: 800px;\">\n        <sc-for list=\"{{ ferramentas }}\" as=\"x\" hint-placeholder-count=\"11\">\n          <span data-k=\"{{ x.k }}\" style=\"font: 500 13px 'IBM Plex Sans', sans-serif; padding: 8px 14px; border-radius: 999px; border: 1px solid {{ x.borda }}; color: {{ x.cor }}; background: {{ x.bg }}; opacity: var(--k, 1); filter: blur(calc((1 - var(--k, 1)) * 8px)); transform: translate3d(0, calc((1 - var(--k, 1)) * 30px), calc((1 - var(--k, 1)) * -160px)) rotateX(calc((1 - var(--k, 1)) * 50deg));\">{{ x.nome }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"proposta\" data-cena=\"enter\" data-screen-label=\"Monte seu projeto\" style=\"max-width: 1180px; margin: 0 auto; padding: 40px clamp(20px, 4vw, 32px) 120px; box-sizing: border-box;\">\n  <div data-k=\"0,0.4\" style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 44px; opacity: var(--k, 1); filter: blur(calc((1 - var(--k, 1)) * 12px)); transform: translate3d(0, calc((1 - var(--k, 1)) * 48px), 0);\">\n    <p style=\"font: italic 500 20px 'Newsreader', serif; color: #66635c;\">Capítulo 06 · Monte seu projeto<\u002Fp>\n    <h2 style=\"font: 700 clamp(2.2rem, 1.4rem + 3vw, 4rem)/1 'Space Grotesk', sans-serif; letter-spacing: -0.04em;\">Quanto custa construir <span style=\"color: #a9a69d;\">essa experiência?<\u002Fspan><\u002Fh2>\n    <p style=\"font: 400 16px/1.6 'IBM Plex Sans', sans-serif; color: #66635c; max-width: 620px;\">Escolha os módulos e veja uma faixa de investimento. O valor final depende de complexidade, número de páginas ou telas, revisões e prazo, e é fechado depois de uma conversa.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 32px; align-items: start;\">\n    <div data-k=\"0.15,0.45\" style=\"opacity: var(--k, 1); filter: blur(calc((1 - var(--k, 1)) * 8px)); transform: translate3d(0, calc((1 - var(--k, 1)) * 40px), 0);\">\n      <div style=\"display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px;\">\n        <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"padding: 9px 18px; border-radius: 999px; border: 1px solid {{ c.borda }}; background: {{ c.bg }}; color: {{ c.cor }}; font: 500 13px 'IBM Plex Sans', sans-serif; cursor: pointer; transition: background 200ms, color 200ms;\">{{ c.nome }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid #cac7bf;\">\n        <sc-for list=\"{{ servicos }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"width: 100%; display: flex; align-items: center; gap: 16px; text-align: left; padding: 20px 6px; background: none; border: none; border-bottom: 1px solid #cac7bf; cursor: pointer; color: #0e0d0c;\">\n            <span style=\"flex: 1; min-width: 0;\">\n              <span style=\"display: block; font: 600 17px 'Space Grotesk', sans-serif; letter-spacing: -0.02em;\">{{ s.nome }}<\u002Fspan>\n              <span style=\"display: block; font: 400 14px/1.5 'IBM Plex Sans', sans-serif; color: #66635c; margin-top: 4px;\">{{ s.info }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font: 500 12px 'IBM Plex Mono', monospace; color: #b8380c; white-space: nowrap;\">{{ s.faixa }}<\u002Fspan>\n            <span style=\"width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid {{ s.borda }}; background: {{ s.bg }}; color: {{ s.corMarca }}; display: flex; align-items: center; justify-content: center; font: 700 14px 'Space Grotesk', sans-serif; transform: scale({{ s.esc }}); transition: transform 300ms cubic-bezier(.16,1,.3,1), background 200ms;\">{{ s.marca }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-k=\"0.25,0.45\" style=\"position: sticky; top: 96px; perspective: 1200px; opacity: var(--k, 1); filter: blur(calc((1 - var(--k, 1)) * 10px));\">\n      <div style=\"background: #0e0d0c; color: #f7f6f3; border-radius: 24px; padding: 30px 26px; display: flex; flex-direction: column; gap: 18px; transform: rotateY(calc((1 - var(--k, 1)) * -22deg)) translate3d(calc((1 - var(--k, 1)) * 40px), 0, calc((1 - var(--k, 1)) * -120px)); box-shadow: 0 30px 60px rgba(14,13,12,.18);\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px;\">\n          <p style=\"font: italic 500 17px 'Newsreader', serif; color: rgba(247,246,243,0.62);\">Seu projeto<\u002Fp>\n          <h3 style=\"font: 700 22px 'Space Grotesk', sans-serif; letter-spacing: -0.03em;\">Resumo<\u002Fh3>\n        <\u002Fdiv>\n        <sc-if value=\"{{ semSel }}\" hint-placeholder-val=\"{{ true }}\">\n          <p style=\"font: 400 14px/1.5 'IBM Plex Sans', sans-serif; color: rgba(247,246,243,0.55);\">Adicione ao menos um módulo ao lado.<\u002Fp>\n        <\u002Fsc-if>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <sc-for list=\"{{ resumo }}\" as=\"r\" hint-placeholder-count=\"0\">\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; font: 400 14px 'IBM Plex Sans', sans-serif; color: rgba(247,246,243,0.85); animation: jsSobe 0.45s cubic-bezier(.16,1,.3,1) both;\"><span>{{ r.nome }}<\u002Fspan><span style=\"font: 500 12px 'IBM Plex Mono', monospace; color: rgba(247,246,243,0.6); white-space: nowrap;\">{{ r.faixa }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid rgba(255,255,255,0.16); padding-top: 16px;\">\n          <span style=\"display: block; font: 500 11px 'IBM Plex Mono', monospace; letter-spacing: 0.08em; color: rgba(247,246,243,0.55); margin-bottom: 4px;\">ESTIMATIVA<\u002Fspan>\n          <span style=\"font: 700 26px 'Space Grotesk', sans-serif; letter-spacing: -0.03em; color: #d4ff3a;\">{{ total }}<\u002Fspan>\n        <\u002Fdiv>\n        <input id=\"p-nome\" type=\"text\" placeholder=\"Seu nome\" style=\"width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 13px 16px; color: #f7f6f3; font: 400 14px 'IBM Plex Sans', sans-serif; outline: none;\" style-focus=\"border-color: #ff5a1f\">\n        <button sc-camel-on-click=\"{{ onPropZap }}\" style=\"width: 100%; padding: 16px; border-radius: 999px; border: none; background: {{ btnBg }}; color: {{ btnCor }}; font: 600 15px 'IBM Plex Sans', sans-serif; cursor: pointer; transition: background 200ms;\">Enviar no WhatsApp →<\u002Fbutton>\n        <p style=\"font: 500 10px 'IBM Plex Mono', monospace; letter-spacing: 0.08em; color: rgba(247,246,243,0.45); text-align: center;\">VALORES ESTIMADOS · PROPOSTA FINAL APÓS CONVERSA<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer id=\"contato\" data-cena=\"enter\" data-screen-label=\"Rodapé\" style=\"position: relative; overflow: hidden; background: #d4ff3a; color: #0e0d0c; padding: clamp(80px, 10vw, 120px) clamp(20px, 4vw, 32px) 0;\">\n  <div style=\"max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; align-items: flex-start;\">\n    <div data-k=\"0,0.5\" style=\"display: flex; flex-direction: column; gap: 30px; align-items: flex-start; opacity: var(--k, 1); filter: blur(calc((1 - var(--k, 1)) * 14px)); transform: translate3d(0, calc((1 - var(--k, 1)) * 60px), 0);\">\n      <p style=\"font: italic 500 22px 'Newsreader', serif;\">Fim da história. Começo da sua.<\u002Fp>\n      <h2 style=\"font: 700 clamp(2.6rem, 1.4rem + 5vw, 6rem)/0.95 'Space Grotesk', sans-serif; letter-spacing: -0.045em; max-width: 12ch;\">Vamos construir algo que <span style=\"background-image: linear-gradient(#ff5a1f, #ff5a1f); background-repeat: no-repeat; background-size: 100% 0.09em; background-position: 0 92%;\">funciona<\u002Fspan>.<\u002Fh2>\n      <a href=\"https://wa.me/5534999078347?text=Ol%C3%A1%2C%20Joander!%20Vim%20pelo%20site%20e%20quero%20conversar%20sobre%20um%20projeto.\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; padding: 17px 30px; border-radius: 999px; background: #0e0d0c; color: #f7f6f3; font: 600 16px 'IBM Plex Sans', sans-serif;\" style-hover=\"background: #ff5a1f; color: #0e0d0c\">Agendar uma conversa →<\u002Fa>\n    <\u00 ype=\"text/x-dc\" data-dc-script=\"\">\nconst ZAP = '5534999078347';\nconst INK = '#0e0d0c', PAPER = '#f7f6f3', ORANGE = '#ff5a1f', LIMA = '#d4ff3a';\n\nconst TRABALHOS = [\n  ['PopVita', 'https://popvitainformacoes.framer.website/', 'Plataforma', 'Plataforma de informações da PopVita, com conteúdo organizado e acessível para o time.'],\n  ['Criacamis', 'https://criacamis.github.io/criacamis/', 'Portfólio + CMS', 'Portfólio com CMS: projetos fáceis de atualizar sem mexer no layout.'],\n  ['Raquel Frias', 'https://raquelfrias.com.br/portfolio.dc', 'Portfólio + CMS', 'Portfólio profissional com CMS, focado em posicionamento.'],\n  ['Gestor de Eventos', 'https://design-performance.github.io/gestordeeventos/', 'Sistema', 'Agenda, inscrições e informações centralizadas num só lugar.'],\n  ['Relatório Unimed', 'https://design-performance.github.io/plataforma-unimed/', 'Relatório digital', 'Relatório interativo da Unimed: dados e resultados em navegação fluida.'],\n  ['Dashboard Unimed', 'https://extraordinary-semolina-5bce6a.netlify.app/', 'Dashboard', 'Painel administrativo com indicadores numa visão única.'],\n  ['Serviços Próprios', 'https://servicospropriosunimeduberlandia.framer.website/', 'Plataforma', 'Plataforma dos serviços próprios da Unimed Uberlândia.'],\n  ['Unimed 55 Anos', 'https://unimeduberlandia55anos.framer.website/', 'Landing page', 'Página comemorativa dos 55 anos da Unimed Uberlândia.']\n];\n\nconst SERVICOS = [\n  { cat: 'Sites', itens: [\n    ['lp', 'Landing Page', 'Página focada em conversão: estrutura, UX, interface e responsividade.', 1800, 3500],\n    ['one', 'Site One Page', 'Site completo numa página, com implementação.', 2500, 4500],\n    ['inst', 'Site Institucional', 'Até 8 páginas, com UX, interface, implementação e publicação.', 4500, 8500],\n    ['port', 'Portfólio Profissional', 'Site para profissionais e criadores, com foco em posicionamento.', 3500, 7000],\n    ['func', 'Site com Funcionalidades', 'Áreas restritas, integrações e recursos sob medida.', 6000, 12000]\n  ]},\n  { cat: 'UX/UI', itens: [\n    ['tela', 'Interface (por tela)', 'Dashboard, login, cadastro ou área de usuário.', 350, 750],\n    ['fluxo', 'Fluxo UX/UI completo', 'Arquitetura, fluxos, wireframes, interface e protótipo.', 2000, 6000],\n    ['ds', 'Design System', 'Componentes, padrões, estados e variantes.', 2000, 5000]\n  ]},\n  { cat: 'Implementação', itens: [\n    ['impl', 'Implementação Web', 'Do layout ao site funcional, responsivo e publicado.', 1500, 5000],\n    ['cms', 'CMS / Estrutura de conteúdo', 'Atualize páginas e projetos sem mexer no layout.', 1500, 4000],\n    ['integ', 'Integrações e automações', 'Formulários, APIs, pagamentos, ferramentas externas.', 1000, 5000]\n  ]},\n  { cat: 'Evolução', itens: [\n    ['audit', 'Auditoria UX/UI', 'Problemas de usabilidade e recomendações priorizadas.', 800, 2000],\n    ['consult', 'Consultoria (por hora)', 'Estrutura, UX/UI, ferramentas e produto.', 250, 400],\n    ['evol', 'Evolução contínua (mês)', 'Melhorias, novas páginas e manutenção.', 300, 800]\n  ]}\n];\n\nconst FRENTES = [\n  ['Web Design', 'Sites com estrutura, hierarquia e experiência pensadas para o objetivo do negócio.'],\n  ['UX/UI', 'Interfaces, fluxos e sistemas que tornam produtos claros e fáceis de usar.'],\n  ['Desenvolvimento Web', 'O projeto vira experiência funcional, responsiva e publicada.'],\n  ['Sistemas digitais', 'CMS, componentes e estruturas que evoluem junto com o projeto.']\n];\n\nconst ETAPAS = [\n  ['Entender', 'Objetivos, público, contexto e o que o projeto precisa resolver.'],\n  ['Estruturar', 'Arquitetura de conteúdo, fluxos, páginas e funcionalidades.'],\n  ['Projetar', 'UX, interface, componentes, responsividade e direção visual.'],\n  ['Construir', 'Implementação web, CMS, integrações e funcionalidades.'],\n  ['Publicar', 'Testes, ajustes, otimização e publicação.'],\n  ['Evoluir', 'Acompanhamento e melhorias conforme o projeto cresce.']\n];\n\nconst FERRAMENTAS = ['Figma', 'Framer', 'Design Systems', 'HTML · CSS · JS', 'GitHub', 'Cloudflare', 'Netlify', 'Claude', 'Photoshop', 'Briefly', 'Gestor de Eventos'];\nconst CHIP = { 'Briefly': ['#3b5bff', PAPER], 'Gestor de Eventos': ['#12a594', INK] };\n\nconst TRILHO = [['topo', 'Início'], ['faco', 'O que faço'], ['trabalhos', 'Trabalhos'], ['autorais', 'Autorais'], ['processo', 'Processo'], ['sobre', 'Sobre'], ['proposta', 'Projeto'], ['contato', 'Contato']];\n\nconst moeda = (n) => 'R$ ' + n.toLocaleString('pt-BR');\nconst faixa = (a, b) => moeda(a) + ' – ' + moeda(b);\nconst cl = (v) => Math.max(0, Math.min(1, v));\n\nclass Component extends DCLogic {\n  state = { trab: 0, cat: 0, sel: {}, wide: false, passo: '01', ativo: 'topo', veu: 1 };\n\n  componentDidMount() {\n    const reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.reduz = reduz;\n    const root = document.documentElement;\n    const medir = () => {\n      const wide = window.innerWidth >= 1024 && !reduz;\n      if (wide !== this.state.wide) this.setState({ wide });\n    };\n    const tick = () => {\n      this.raf = null;\n      const vh = window.innerHeight;\n      const ps = new Map();\n      document.querySelectorAll('[data-cena]').forEach(el => {\n        let p = 1, q = 0;\n        if (!reduz) {\n          const r = el.getBoundingClientRect();\n          if (el.dataset.cena === 'pin' && this.state.wide) p = cl(-r.top / Math.max(1, r.height - vh));\n          else p = cl((vh - r.top) / (vh * 0.75));\n          if (el.dataset.cena === 'hero') q = cl(-r.top / (r.height * 0.8));\n        }\n        ps.set(el, p);\n        el.style.setProperty('--p', p.toFixed(4));\n        el.style.setProperty('--q', q.toFixed(4));\n        if (el.id === 'processo') {\n          const n = '0' + Math.min(6, Math.max(1, Math.floor((p - 0.08) / 0.13) + 1));\n          if (n !== this.state.passo) this.setState({ passo: n });\n        }\n      });\n      document.querySelectorAll('[data-k]').forEach(el => {\n        const c = el.parentElement && el.parentElement.closest('[data-cena]');\n        const p = c ? (ps.get(c) ?? 1) : 1;\n        const [a, d] = String(el.dataset.k).split(',').map(Number);\n        el.style.setProperty('--k', cl((p - (a || 0)) / (d || 1)).toFixed(4));\n      });\n      const max = document.documentElement.scrollHeight - vh;\n      root.style.setProperty('--prog', (max > 0 ? cl(window.scrollY / max) : 0).toFixed(4));\n      let ativo = 'topo';\n      TRILHO.forEach(([id]) => { const e = document.getElementById(id); if (e && e.getBoundingClientRect().top < vh * 0.45) ativo = id; });\n      if (ativo !== this.state.ativo) this.setState({ ativo });\n    };\n    this.tick = tick;\n    this.onScroll = () => { if (!this.raf) this.raf = requestAnimationFrame(tick); };\n    this.onMouse = (e) => {\n      root.style.setProperty('--mx', ((e.clientX / window.innerWidth) * 2 - 1).toFixed(3));\n      root.style.setProperty('--my', ((e.clientY / window.innerHeight) * 2 - 1).toFixed(3));\n    };\n    this.onResize = () => { medir(); this.onScroll(); };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    window.addEventListener('resize', this.onResize);\n    if (!reduz) window.addEventListener('mousemove', this.onMouse, { passive: true });\n    medir();\n    tick();\n    this.veuT = setTimeout(() => this.setState({ veu: 0 }), 900);\n  }\n\n  componentDidUpdate(_, prev) {\n    if (prev.wide !== this.state.wide && this.onScroll) this.onScroll();\n    if (prev.trab !== this.state.trab) {\n      clearTimeout(this.veuT);\n      this.veuT = setTimeout(() => this.setState({ veu: 0 }), 900);\n    }\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('mousemove', this.onMouse);\n    if (this.raf) cancelAnimationFrame(this.raf);\n    clearTimeout(this.veuT);\n  }\n\n  zap(msg) {\n    window.open('https://wa.me/' + ZAP + '?text=' + encodeURIComponent(msg), '_blank');\n  }\n\n  renderVals() {\n    const s = this.state;\n    const wide = s.wide;\n    const t = TRABALHOS[s.trab];\n    const todos = SERVICOS.flatMap(c => c.itens);\n    const escolhidos = todos.filter(i => s.sel[i[0]]);\n    const min = escolhidos.reduce((a, i) => a + i[3], 0);\n    const max = escolhidos.reduce((a, i) => a + i[4], 0);\n    const ativoIdx = TRILHO.findIndex(([id]) => id === s.ativo);\n\n    return {\n      wide,\n      pinFaco: wide ? '230vh' : 'auto',\n      pinProc: wide ? '280vh' : 'auto',\n      pinPos: wide ? 'sticky' : 'relative',\n      pinMin: wide ? '100vh' : '0',\n      passo: s.passo,\n      trilho: TRILHO.map(([id, nome], i) => ({\n        href: '#' + id, nome, num: '0' + (i + 1), ativo: id === s.ativo,\n        dot: i <= ativoIdx ? ORANGE : 'rgba(247,246,243,0.3)'\n      })),\n      frentes: FRENTES.map(([titulo, texto], i) => {\n        const lima = i === 1;\n        return { num: '0' + (i + 1), titulo, texto,\n          k: (wide ? 0.18 + i * 0.13 : 0.1 + i * 0.08) + ',' + (wide ? 0.3 : 0.4),\n          off: wide ? (1.5 - i) * 100 : 0, rz: (i - 1.5) * 5, z: 4 - i,\n          bg: lima ? LIMA : '#ffffff', borda: lima ? LIMA : '#e2e0da',\n          apoio: lima ? '#322f2c' : '#66635c', numCor: lima ? INK : '#86837b', no: lima ? INK : ORANGE };\n      }),\n      trabalhos: TRABALHOS.map((w, i) => ({\n        num: String(i + 1).padStart(2, '0'), nome: w[0],\n        bg: i === s.trab ? INK : 'transparent', cor: i === s.trab ? PAPER : INK,\n        borda: i === s.trab ? INK : '#cac7bf', corNum: i === s.trab ? ORANGE : '#86837b',\n        onClick: () => { if (i !== s.trab) this.setState({ trab: i, veu: 1 }); }\n      })),\n      trabUrl: t[1], trabTag: t[2], trabDesc: t[3], trabNomeUp: t[0].toUpperCase(),\n      veu: s.veu,\n      trabUrlTxt: t[1].replace(/^https?:\\/\\//, '').replace(/\\/$/, ''),\n      contadorTrab: String(s.trab + 1).padStart(2, '0') + ' / ' + String(TRABALHOS.length).padStart(2, '0'),\n      etapas: ETAPAS.map(([titulo, texto], i) => ({ num: '0' + (i + 1), titulo, texto,\n        k: wide ? (0.1 + i * 0.13).toFixed(2) + ',0.13' : (0.15 + i * 0.07).toFixed(2) + ',0.25' })),\n      ferramentas: FERRAMENTAS.map((nome, i) => {\n        const c = CHIP[nome];\n        return { nome, k: (0.3 + i * 0.035).toFixed(3) + ',0.3', borda: c ? c[0] : '#cac7bf', cor: c ? c[1] : INK, bg: c ? c[0] : 'transparent' };\n      }),\n      letras: 'sentido'.split('').map((c, i) => ({ c, k: (0.35 + i * 0.06).toFixed(2) + ',0.35', d: (i * 0.22).toFixed(2) + 's' })),\n      cats: SERVICOS.map((c, i) => ({\n        nome: c.cat,\n        bg: i === s.cat ? INK : 'transparent', cor: i === s.cat ? PAPER : '#4a4844',\n        borda: i === s.cat ? INK : '#cac7bf', onClick: () => this.setState({ cat: i })\n      })),\n      servicos: SERVICOS[s.cat].itens.map(([id, nome, info, a, b]) => {\n        const on = !!s.sel[id];\n        return {\n          nome, info, faixa: faixa(a, b), esc: on ? 1.12 : 1,\n          marca: on ? '✓' : '+', bg: on ? ORANGE : 'transparent',\n          borda: on ? ORANGE : '#cac7bf', corMarca: on ? INK : '#66635c',\n          onClick: () => this.setState({ sel: Object.assign({}, s.sel, { [id]: !on }) })\n        };\n      }),\n      resumo: escolhidos.map(i => ({ nome: i[1], faixa: faixa(i[3], i[4]) })),\n      semSel: escolhidos.length === 0,\n      total: escolhidos.length ? faixa(min, max) : 'R$ 0',\n      btnBg: escolhidos.length ? ORANGE : 'rgba(255,255,255,0.14)',\n      btnCor: escolhidos.length ? INK : 'rgba(247,246,243,0.5)',\n      onHeroZap: () => {\n        const nome = (document.getElementById('h-nome').value || '').trim();\n        const desc = (document.getElementById('h-desc').value || '').trim();\n        this.zap('Olá, Joander! Vim pelo site.' + (nome ? '\\n\\n*Nome:* ' + nome : '') + (desc ? '\\n\\n*Projeto:*\\n' + desc : '') + '\\n\\nQuero conversar sobre um projeto.');\n      },\n      onPropZap: () => {\n        if (!escolhidos.length) return;\n        const nome = (document.getElementById('p-nome').value || '').trim();\n        this.zap('*Projeto — vim pelo site*\\n\\n' + (nome ? '*Nome:* ' + nome + '\\n\\n' : '') +\n          '*Módulos:*\\n' + escolhidos.map(i => '• ' + i[1] + ' — ' + faixa(i[3], i[4])).join('\\n') +\n          '\\n\\n*Estimativa:* ' + faixa(min, max) + '\\n\\nQuero conversar sobre esse escopo.');\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
