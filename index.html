document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ls/eyebrows only */\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace; /* tags, meta, code, timestamps */\n\n  /* ---- Display / headline scale ---- */\n  --text-display-xl: 700 5rem/0.98 var(--font-display);\n  --text-display-lg: 700 3.5rem/1.0 var(--font-display);\n  --text-display-md: 600 2.5rem/1.05 var(--font-display);\n  --text-display-sm: 600 1.5rem/1.15 var(--font-display);\n\n  /* Fluid sizes for the same steps — apply via font-size only, pair with the shorthand above for weight/family/line-height */\n  --size-display-xl: clamp(2.75rem, 2rem + 3.2vw, 5.5rem);\n  --size-display-lg: clamp(2.25rem, 1.7rem + 2.4vw, 4rem);\n  --size-display-md: clamp(1.75rem, 1.4rem + 1.4vw, 2.75rem);\n\n  /* ---- Body scale ---- */\n  --text-body-lg: 400 1.25rem/1.55 var(--font-body);\n  --text-body-md: 400 1.0625rem/1.6 var(--font-body);\n  --text-body-sm: 400 0.9375rem/1.55 var(--font-body);\n  --text-body-xs: 400 0.8125rem/1.5 var(--font-body);\n\n  /* ---- Eyebrow / accent italic ---- */\n  --text-eyebrow-md: italic 500 1.125rem/1.3 var(--font-eyebrow);\n  --text-eyebrow-sm: italic 500 0.9375rem/1.3 var(--font-eyebrow);\n\n  /* ---- Mono / label scale ---- */\n  --text-mono-md: 500 0.875rem/1.4 var(--font-mono);\n  --text-mono-sm: 500 0.75rem/1.4 var(--font-mono);\n  --text-label: 500 0.75rem/1 var(--font-mono);\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.03em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-label: 0.08em;\n}\n<\u002Fstyle>\n  <style>/* Joander Santos — Spacing, radius, shadow, motion tokens */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---- Radius ---- */\n  --radius-sm: 6px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n bec9b63\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n\n/* Joander Santos — Color tokens\n   Grayscale-led, technical portfolio system with a single high-signal accent. */\n\n:root {\n  /* ---- Base neutrals ---- */\n  --gray-0: #ffffff;\n  --gray-25: #f7f6f3;   /* warm paper — primary light surface */\n  --gray-50: #efeee9;\n  --gray-100: #e2e0da;\n  --gray-200: #cac7bf;\n  --gray-300: #a9a69d;\n  --gray-400: #86837b;\n  --gray-500: #66635c;\n  --gray-600: #4a4844;\n  --gray-700: #322f2c;\n  --gray-800: #1d1b19;\n  --gray-900: #0e0d0c;  /* near-black — primary dark surface */\n  --gray-950: #050505;\n\n  /* ---- Accent: signal orange ---- */\n  --accent-25: #fff1ea;\n  --accent-100: #ffd9c2;\n  --accent-300: #ff9a63;\n  --accent-500: #ff5a1f;  /* primary accent */\n  --accent-600: #e2470f;\n  --accent-700: #b8380c;\n  --accent-900: #5c1c06;\n\n  /* ---- Semantic feedback (minimal, used only in form/system states) ---- */\n  --success-500: #1f8f5f;\n  --success-100: #dcf1e6;\n  --danger-500: #d3401f;\n  --danger-100: #fbe2da;\n\n  /* ---- Semantic aliases ---- */\n  --bg-page: var(--gray-25);\n  --bg-page-inverse: var(--gray-900);\n  --bg-surface: var(--gray-0);\n  --bg-surface-inverse: var(--gray-800);\n  --bg-sunken: var(--gray-50);\n  --bg-overlay: rgba(14, 13, 12, 0.72);\n\n  --border-default: var(--gray-200);\n  --border-strong: var(--gray-900);\n  --border-inverse: rgba(255, 255, 255, 0.16);\n  --border-accent: var(--accent-500);\n\n  --text-primary: var(--gray-900);\n  --text-secondary: var(--gray-500);\n  --text-tertiary: var(--gray-300);\n  --text-inverse: var(--gray-25);\n  --text-inverse-secondary: rgba(247, 246, 243, 0.64);\n  --text-accent: var(--accent-600);\n  --text-on-accent: var(--gray-950);\n\n  --accent-primary: var(--accent-500);\n  --accent-primary-hover: var(--accent-600);\n  --accent-primary-press: var(--accent-700);\n  --accent-tint: var(--accent-25);\n\n  --focus-ring: var(--accent-500);\n}\n\n/* Joander Santos — Typography tokens */\n\n:root {\n  /* ---- Families ---- */\n  --font-display: 'Space Grotesk', 'Arial Narrow', sans-serif;   /* headlines, wordmark, big numerals */\n  --font-body: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; /* paragraphs, UI copy */\n  --font-eyebrow: 'Newsreader', Georgia, serif;   /* italic serif accent — small labels/eyebrows only */\n  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace; /* tags, meta, code, timestamps */\n\n  /* ---- Display / headline scale ---- */\n  --text-display-xl: 700 5rem/0.98 var(--font-display);\n  --text-display-lg: 700 3.5rem/1.0 var(--font-display);\n  --text-display-md: 600 2.5rem/1.05 var(--font-display);\n  --text-display-sm: 600 1.5rem/1.15 var(--font-display);\n\n  /* Fluid sizes for the same steps — apply via font-size only, pair with the shorthand above for weight/family/line-height */\n  --size-display-xl: clamp(2.75rem, 2rem + 3.2vw, 5.5rem);\n  --size-display-lg: clamp(2.25rem, 1.7rem + 2.4vw, 4rem);\n  --size-display-md: clamp(1.75rem, 1.4rem + 1.4vw, 2.75rem);\n\n  /* ---- Body scale ---- */\n  --text-body-lg: 400 1.25rem/1.55 var(--font-body);\n  --text-body-md: 400 1.0625rem/1.6 var(--font-body);\n  --text-body-sm: 400 0.9375rem/1.55 var(--font-body);\n  --text-body-xs: 400 0.8125rem/1.5 var(--font-body);\n\n  /* ---- Eyebrow / accent italic ---- */\n  --text-eyebrow-md: italic 500 1.125rem/1.3 var(--font-eyebrow);\n  --text-eyebrow-sm: italic 500 0.9375rem/1.3 var(--font-eyebrow);\n\n  /* ---- Mono / label scale ---- */\n  --text-mono-md: 500 0.875rem/1.4 var(--font-mono);\n  --text-mono-sm: 500 0.75rem/1.4 var(--font-mono);\n  --text-label: 500 0.75rem/1 var(--font-mono);\n\n  /* ---- Letter spacing ---- */\n  --tracking-tight: -0.03em;\n  --tracking-normal: 0em;\n  --tracking-wide: 0.04em;\n  --tracking-label: 0.08em;\n}\n\n/* Joander Santos — Spacing, radius, shadow, motion tokens */\n\n:root {\n  /* ---- Spacing scale (4px base) ---- */\n  --space-1: 4px;\n  --space-2: 8px;\n  --space-3: 12px;\n  --space-4: 16px;\n  --space-5: 20px;\n  --space-6: 24px;\n  --space-8: 32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n  --space-32: 128px;\n\n  /* ---- Radius ---- */\n  --radius-sm: 6px;\n  --radius-md: 12px;\n  --radius-lg: 20px;\n  --radius-xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---- Shadow (soft, single low-angle light source; no color tint) ---- */\n  --shadow-xs: 0 1px 2px rgba(14, 13, 12, 0.06);\n  --shadow-sm: 0 2px 8px rgba(14, 13, 12, 0.08);\n  --shadow-md: 0 8px 24px rgba(14, 13, 12, 0.10);\n  --shadow-lg: 0 20px 48px rgba(14, 13, 12, 0.14);\n  --shadow-inverse-sm: 0 2px 8px rgba(0, 0, 0, 0.4);\n\n  /* ---- Border widths ---- */\n  --border-thin: 1px;\n  --border-thick: 1.5px;\n\n  /* ---- Motion ---- */\n  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --duration-fast: 120ms; /* @kind other */\n  --duration-base: 200ms; /* @kind other */\n  --duration-slow: 420ms; /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"adf3b7de-606e-4b96-997b-69a0b8efd26c\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: var(--bg-page); color: var(--text-primary); }\n    a { color: var(--text-accent); text-decoration: none; }\n    a:hover { color: var(--accent-primary-hover); }\n    @keyframes spin { to { transform: rotate(360deg); } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- TOP BAR -->\n<div style=\"position: sticky; top: 0; z-index: 50; background: rgba(247,246,243,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-default);\">\n  <div style=\"max-width: 1200px; margin: 0 auto; padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;\">\n    <div style=\"display: flex; align-items: ce argin: 0;\">Propostas premium que impressionam clientes.<\u002Fp>\n      <\u002Fdiv>\n      <!-- Features -->\n      <div style=\"padding: 28px 36px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <div style=\"width: 32px; height: 32px; border-radius: 8px; background: #f3f0ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"2\"><path d=\"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <span style=\"font: 600 14px var(--font-body); color: #1a1a1a;\">PDF paginado premium<\u002Fspan>\n              <p style=\"font: 13px var(--font-body); color: #888; margin: 0;\">7 páginas com capa, ícones e visual profissional<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <div style=\"width: 32px; height: 32px; border-radius: 8px; background: #f3f0ff; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">\n              <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7c3aed\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 6v6l4 2\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <div>\n              <span style=\"font: 600 14px var(--font-body); color: #1a1a1a;\">Propostas ilimitadas<\u002Fspan>\n              <p style=\"font: 13px var(--font-body); color: #888; margin: 0;\">Sem limite de 5 propostas<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 12px;\">\n            <div style=\"width: 3 u002Flabel>\n        <button sc-camel-on-click=\"{{ onToggleAudio }}\" style=\"display: flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--border-default); border-radius: 999px; padding: 4px 12px; cursor: pointer; color: {{ audioBtnColor }}; font: var(--text-mono-sm);\" style-hover=\"border-color: var(--accent-primary)\">\n          <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z\"><\u002Fpath><path d=\"M19 10v2a7 7 0 01-14 0v-2\"><\u002Fpath><line x1=\"12\" y1=\"19\" x2=\"12\" y2=\"23\"><\u002Fline><\u002Fsvg>\n          {{ audioLabel }}\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showAudioRecorder }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: var(--bg-sunken); border: 1px solid {{ audioBorder }}; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;\">\n          <sc-if value=\"{{ isRecording }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\">\n              <div style=\"width: 12px; height: 12px; border-radius: 50%; background: #dc2626; animation: pulse 1s ease-in-out infinite;\"><\u002Fdiv>\n              <span style=\"font: var(--text-body-sm); color: #dc2626;\">Gravando... {{ recordTime }}<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onStopRecording }}\" style=\"padding: 10px 24px; border-radius: 999px; border: none; background: #dc2626; color: #fff; font: 600 14px var(--font-body); cursor: pointer;\" style-hover=\"opacity: 0.9\">Parar gravação<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isTranscribing }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font: var(--text-body-sm); color: var(--text-secondary);\">Transcrevendo áudio        <\u002Fdiv>\n              <h2 style=\"font: 700 32px var(--font-display); color: #fff; margin: 0 0 8px; letter-spacing: -0.03em; line-height: 1.1;\">{{ projectTitle }}<\u002Fh2>\n              <div style=\"display: flex; align-items: center; gap: 16px; margin-top: 12px;\">\n                <span style=\"font: 14px var(--font-body); color: rgba(255,255,255,0.7);\">{{ projectDate }}<\u002Fspan>\n                <div style=\"width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.3);\"><\u002Fdiv>\n                <span style=\"font: 14px var(--font-body); color: rgba(255,255,255,0.7);\">{{ designerRole }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- RESUMO — hero card -->\n          <div style=\"padding: 36px 48px 32px;\">\n            <div style=\"background: {{ brandColorLight }}; border: 1px solid {{ brandColorBorder }}; border-radius: 16px; padding: 28px 32px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n                <div style=\"width: 40px; height: 40px; border-radius: 12px; background: {{ brandColor }}; display: flex; align-items: center; justify-content: center;\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z\"><\u002Fpath><polyline points=\"14 2 14 8 20 8\"><\u002Fpolyline><line x1=\"16\" y1=\"13\" x2=\"8\" y2=\"13\"><\u002Fline><line x1=\"16\" y1=\"17\" x2=\"8\" y2=\"17\"><\u002Fline><\u002Fsvg>\n                <\u002Fdiv>\n                <div>\n                  <span style=\"font: 700 17px var(--font-display); color: #1a1a1a; letter-spacing: -0.01em;\">Resumo do projeto<\u002Fspan>\n                  <span style=\"font: 500 11px var(--font-mono); color: {{ brandColor }}; margin-left: 10px; letter-spacing: 0.06em;\">VISÃO GERAL<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font: 14px/1.9 var(--font-body); color: #333; white-space: pre-wrap;\">{{ catResumo }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- ESCOPO — with left accent bar -->\n          <div style=\"padding: 0 48px 32px;\">\n            <div style=\"display: flex; gap: 0; border-radius: 16px; overflow: hidden; border: 1px solid #eee;\">\n              <div style=\"width: 5px; background: {{ brandColor }}; flex-shrink: 0;\"><\u002Fdiv>\n              <div style=\"padding: 28px 32px; flex: 1;\">\n                <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\">\n                  <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #f5f5f4; display: flex; align-items: center; justify-content: center;\">\n                    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ brandColor }}\" stroke-width=\"2\" stroke-linecap=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"><\u002Frect><\u002Fsvg>\n                  <\u002Fdiv>\n                  <span style=\"font: 700 17px var(--font-display); color: #1a1a1a; letter-spacing: -0.01em;\">Escopo e entregáveis<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font: 14px/1.9 var(--font-body); color: #444; white-space: pre-wrap;\">{{ catEscopo }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- TIMELINE — horizontal steps feel -->\n          <div style=\"padding: 0 48px 32px;\">\n            <div style=\"display: flex; gap: 0; border-radius: 16px; overflow: hidden; border: 1px solid #eee;\">\n              <div style=\"width: 5px; background: {{ brandColor }}; flex-shrink: 0;\"><\u002Fdiv>\n              <div style=\"padding: 28px 32px; flex: 1;\">\n                <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\">\n                  <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #f5f5f4; display: flex; align-items: center; justify-content: center;\">\n                    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ brandColor }}\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><polyline points=\"12 6 12 12 16 14\"><\u002Fpolyline><\u002Fsvg>\n                  <\u002Fdiv>\n                  <span style=\"font: 700 17px var(--font-display); color: #1a1a1a; letter-spacing: -0.01em;\">Prazo e etapas<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font: 14px/1.9 var(--font-body); color: #444; white-space: pre-wrap;\">{{ catTimeline }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- INVESTIMENTO — highlighted box -->\n          <div style=\"padding: 0 48px 32px;\">\n            <div style=\"background: {{ brandColor }}; border-radius: 16px; padding: 32px 36px; position: relative; overflow: hidden;\">\n              <div style=\"position: absolute; top: -30px; right: -20px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.08);\"><\u002Fdiv>\n              <div style=\"position: relative; z-index: 1;\">\n                <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 18px;\">\n                  <div style=\"width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;\">\n                    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"12\" y1=\"1\" x2=\"12\" y2=\"23\"><\u002Fline><path d=\"M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                  <span style=\"font: 700 17px var(--font-display); color: #fff; letter-spacing: -0.01em;\">Investimento<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font: 14px/1.9 var(--font-body); color: rgba(255,255,255,0.9); white-space: pre-wrap;\">{{ catInvestimento }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- NÃO INCLUÍDO — subtle warning style -->\n          <div style=\"padding: 0 48px 32px;\">\n            <div style=\"background: #fef7f7; border: 1px solid #fecaca; border-radius: 16px; padding: 28px 32px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n                <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #fee2e2; display: flex; align-items: center; justify-content: center;\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"15\" y1=\"9\" x2=\"9\" y2=\"15\"><\u002Fline><line x1=\"9\" y1=\"9\" x2=\"15\" y2=\"15\"><\u002Fline><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"font: 700 17px var(--font-display); color: #991b1b; letter-spacing: -0.01em;\">O que não está incluído<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font: 14px/1.9 var(--font-body); color: #7f1d1d; white-space: pre-wrap;\">{{ catExcluido }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- PERGUNTAS — info style -->\n          <div style=\"padding: 0 48px 32px;\">\n            <div style=\"background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 16px; padding: 28px 32px;\">\n              <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 16px;\">\n                <div style=\"width: 40px; height: 40px; border-radius: 12px; background: #dbeafe; display: flex; align-items: center; justify-content: center;\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2563eb\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3\"><\u002Fpath><line x1=\"12\" y1=\"17\" x2=\"12.01\" y2=\"17\"><\u002Fline><\u002Fsvg>\n                <\u002Fdiv>\n                <span style=\"font: 700 17px var(--font-display); color: #1e3a5f; letter-spacing: -0.01em;\">Perguntas para alinhar<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font: 14px/1.9 var(--font-body); color: #1e40af; white-space: pre-wrap;\">{{ catPerguntas }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- FOOTER -->\n          <div style=\"padding: 28px 48px; background: #fafaf9; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: space-between;\">\n            <div style=\"display: flex; align-items: center; gap: 12px;\">\n              <div style=\"width: 36px; height: 36px; border-radius: 10px; background: {{ brandColor }}; display: flex; align-items: center; justify-content: center;\">\n                <span style=\"font: 700 14px var(--font-display); color: #fff;\">{{ designerInitials }}<\u002Fspan>\n              <\u002Fdiv>\n              <div>\n                <span style=\"font: 600 14px var(--font-body); color: #1a1a1a; display: block;\">{{ designerName }}<\u002Fspan>\n                <span style=\"font: 12px var(--font-body); color: #888;\">{{ designerRole }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"text-align: right;\">\n              <span style=\"font: 500 10px var(--font-mono); color: #bbb; letter-spacing: 0.1em; display: block;\">POWERED BY<\u002Fspan>\n              <span style=\"font: 600 13px var(--font-display); color: #aaa;\">Briefly<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Actions -->\n        <div style=\"display: flex; gap: 10px;\">\n          <button sc-camel-on-click=\"{{ onCopyAll }}\" style=\"flex: 1; padding: 14px; border-radius: 999px; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-primary); font: 500 14px var(--font-body); cursor: pointer;\" style-hover=\"background: var(--bg-sunken)\">{{ copyLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ isPremium }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ onDownloadPDF }}\" style=\"flex: 1; padding: 14px; border-radius: 999px; border: none; background: {{ brandColor }}; color: #fff; font: 600 14px var(--font-body); cursor: pointer;\" style-hover=\"opacity: 0.9\">Abrir PDF →<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showFreeLabel }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ onDownloadImage }}\" style=\"flex: 1; padding: 14px; border-radius: 999px; border: 1px solid var(--border-default); background: var(--bg-surface); color: var(--text-primary); font: 500 14px var(--font-body); cursor: pointer;\" style-hover=\"background: var(--bg-sunken)\">Baixar imagem<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ onTryPDF }}\" style=\"padding: 14px 20px; border-radius: 999px; border: none; background: #7c3aed; color: #fff; font: 600 14px var(--font-body); cursor: pointer; display: flex; align-items: center; gap: 6px;\" style-hover=\"opacity: 0.9\">\n              PDF <span style=\"font: 500 10px var(--font-mono); background: rgba(255,255,255,0.2); padding: 1px 6px; border-radius: 999px;\">PRO<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    clientMessage: '',\n    designerName: '',\n    designerRole: '',\n    designerLevel: 'pleno',\n    avatarShape: 'circle',\n    logoSrc: '',\n    brandColor: '#0e0d0c',\n    customHex: '',\n    isPremium: false,\n    showUpgrade: false,\n    status: 'idle',\n    briefContent: '',\n    proposalContent: '',\n    questionsContent: '',\n    projectTitle: '',\n    catResumo: '', catEscopo: '', catTimeline: '', catInvestimento: '', catExcluido: '', catPerguntas: '',\n    errorMsg: '',\n    copyLabel: 'Copiar proposta',\n    copyQLabel: 'Copiar perguntas',\n    history: [],\n    usage: 0,\n    extras: 0,\n    categoryFilter: 'Todas'\n  };\n\n  componentDidMount() {\n    try {\n      // Check URL for activation\n      const params = new URLSearchParams(window.location.search);\n      if (params.get('pro') === 'activated') {\n        localStorage.setItem('briefly_premium', 'true');\n        // Clean URL\n        window.history.replaceState({}, '', window.location.pathname);\n      }\n      const h = JSON.parse(localStorage.getItem('briefly_history') || '[]');\n      const premium = localStorage.getItem('briefly_premium') === 'true';\n      // Monthly usage tracking\n      const now = new Date();\n      const monthKey = `${now.getFullYear()}-${now.getMonth()}`;\n      const stored = JSON.parse(localStorage.getItem('briefly_monthly') || '{}');\n      const u = stored.month === monthKey ? (stored.count || 0) : 0;\n      if (stored.month !== monthKey) {\n        localStorage.setItem('briefly_monthly', JSON.stringify({ month: monthKey, count: 0 }));\n      }\n      const extras = parseInt(localStorage.getItem('briefly_extras') || '0');\n      this.setState({ history: h, usage: u, isPremium: premium, extras });\n    } catch(e) {}\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isLoading = s.status === 'loading';\n    return {\n      clientMessage: s.clientMessage,\n      designerName: s.designerName,\n      designerRole: s.designerRole,\n      showEmpty: s.status === 'idle' && !s.briefContent,\n      showLoading: isLoading,\n      showResult: s.status === 'done' && !!(s.briefContent || s.catResumo),\n      briefContent: s.briefContent,\n      proposalContent: s.proposalContent,\n      questionsContent: s.questionsContent,\n      errorMsg: s.errorMsg,\n      copyLabel: s.copyLabel,\n      copyQLabel: s.copyQLabel,\n      usageLabel: s.isPremium ? `${s.usage}/50 este mês` : `${s.usage}/5 este mês`,\n      maxUsage: s.isPremium ? 50 + (s.extras || 0) : 5,\n      btnBg: isLoading ? 'var(--gray-400)' : 'var(--gray-900)',\n      btnColor: 'var(--text-inverse)',\n      btnLabel: isLoading ? 'Gerando...' : 'Gerar proposta →',\n      hasHistory: s.history.length > 0,\n      categoryFilter: s.categoryFilter,\n      categoryFilters: (() => {\n        const cats = ['Todas'];\n        const catSet = new Set();\n        (s.history || []).forEach(h => { if (h.category) catSet.add(h.category); });\n        catSet.forEach(c => cats.push(c));\n        return cats.map(c => {\n          const count = c === 'Todas' ? s.history.length : s.history.filter(h => h.category === c).length;\n          return {\n            label: c,\n            count: `(${count})`,\n            border: s.categoryFilter === c ? 'var(--accent-primary)' : 'var(--border-default)',\n            bg: s.categoryFilter === c ? 'var(--accent-25)' : 'transparent',\n            color: s.categoryFilter === c ? 'var(--accent-primary)' : 'var(--text-secondary)',\n            onClick: () => this.setState({ categoryFilter: c })\n          };\n        });\n      })(),\n      filteredHistory: (s.categoryFilter === 'Todas' ? s.history : s.history.filter(h => h.category === s.categoryFilter)).slice(0, 10).map((h) => ({\n        title: h.title || 'Proposta',\n        date: h.date || '',\n        category: h.category || 'Outros',\n        onLoad: () => this.setState({\n          briefContent: h.brief || h.catResumo || '',\n          proposalContent: h.proposal || h.catEscopo || '',\n          questionsContent: h.questions || h.catPerguntas || '',\n          projectTitle: h.projectTitle || h.title || 'Proposta',\n          catResumo: h.catResumo || h.brief || '',\n          catEscopo: h.catEscopo || '',\n          catTimeline: h.catTimeline || '',\n          catInvestimento: h.catInvestimento || '',\n          catExcluido: h.catExcluido || '',\n          catPerguntas: h.catPerguntas || h.questions || '',\n          status: 'done'\n        })\n      })),\n      brandColor: s.brandColor,\n      hasLogo: !!s.logoSrc,\n      noLogo: !s.logoSrc,\n      logoSrc: s.logoSrc,\n      logoBgUrl: s.logoSrc ? `url(${s.logoSrc})` : 'none',\n      isPremium: s.isPremium,\n      showUpgrade: s.showUpgrade,\n      showFreeLabel: !s.isPremium,\n      showPremiumLabel: s.isPremium,\n      tierLabel: s.isPremium ? 'PRO' : 'FREE',\n      tierBg: s.isPremium ? '#7c3aed' : 'var(--gray-400)',\n      customHex: s.customHex,\n      showCustomHex: s.isPremium,\n      logoUploadBg: s.logoSrc ? 'rgba(5,150,95,0.05)' : 'var(--bg-sunken)',\n      logoUploadBorder: s.logoSrc ? '#059669' : 'var(--border-default)',\n      avatarBg: s.logoSrc ? 'transparent' : 'var(--bg-sunken)',\n      avatarRadius: s.avatarShape === 'circle' ? '50%' : s.avatarShape === 'rounded' ? '14px' : '4px',\n      shapeCircleBorder: s.avatarShape === 'circle' ? 'var(--accent-primary)' : 'var(--border-default)',\n      shapeCircleBg: s.avatarShape === 'circle' ? 'var(--accent-25)' : 'var(--bg-sunken)',\n      shapeRoundedBorder: s.avatarShape === 'rounded' ? 'var(--accent-primary)' : 'var(--border-default)',\n      shapeRoundedBg: s.avatarShape === 'rounded' ? 'var(--accent-25)' : 'var(--bg-sunken)',\n      shapeSquareBorder: s.avatarShape === 'square' ? 'var(--accent-primary)' : 'var(--border-default)',\n      shapeSquareBg: s.avatarShape === 'square' ? 'var(--accent-25)' : 'var(--bg-sunken)',\n      onShapeCircle: () => this.setState({ avatarShape: 'circle' }),\n      onShapeRounded: () => this.setState({ avatarShape: 'rounded' }),\n      onShapeSquare: () => this.setState({ avatarShape: 'square' }),\n      colorOptions: ['#0e0d0c','#ff5a1f','#2563eb','#059669','#7c3aed','#dc2626','#0891b2','#ca8a04'].map(hex => ({\n        hex,\n        border: s.brandColor === hex ? hex : 'transparent',\n        shadow: s.brandColor === hex ? `0 0 0 2px #fff, 0 0 0 4px ${hex}` : 'none',\n        onClick: () => this.setState({ brandColor: hex })\n      })),\n      onCustomHexChange: (e) => {\n        let v = e.target.value.trim();\n        if (v && !v.startsWith('#')) v = '#' + v;\n        this.setState({ customHex: v });\n        if (/^#[0-9a-fA-F]{6}$/.test(v)) this.setState({ brandColor: v });\n      },\n      onCloseUpgrade: () => this.setState({ showUpgrade: false }),\n      onActivatePremium: () => {\n        // Redirect to Mercado Pago checkout\n        const mpLink = 'https://mpago.li/2aGkGJ8';\n        if (mpLink) {\n          window.open(mpLink, '_blank');\n        } else {\n          // Fallback: activation key\n          const key = prompt('Cole sua chave de ativação:');\n          if (key && key.trim().length >= 6) {\n            localStorage.setItem('briefly_premium', 'true');\n            this.setState({ isPremium: true, showUpgrade: false });\n          }\n        }\n      },\n      onActivateWithKey: () => {\n        const key = prompt('Cole sua chave de ativação (recebida após pagamento):');\n        if (key && key.trim().length >= 6) {\n          localStorage.setItem('briefly_premium', 'true');\n          this.setState({ isPremium: true, showUpgrade: false });\n          alert('Pro ativado com sucesso!');\n        } else if (key !== null) {\n          alert('Chave inválida. Verifique e tente novamente.');\n        }\n      },\n      onShowUpgradeFromColor: () => this.setState({ showUpgrade: true }),\n      onTryPDF: () => this.setState({ showUpgrade: true }),\n      onDownloadImage: () => {\n        const el = document.getElementById('proposal-output');\n        if (!el) return;\n        import('https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/+esm').then(mod => {\n          mod.toPng(el, { pixelRatio: 2, cacheBust: true, backgroundColor: '#f0eee9' }).then(url => {\n            const a = document.createElement('a');\n            a.download = `proposta-briefly-${Date.now()}.png`;\n            a.href = url; a.click();\n          });\n        });\n      },\n      onLogoUpload: (e) => {\n        const file = e.target.files?.[0];\n        if (file && file.type.startsWith('image/')) {\n          const reader = new FileReader();\n          reader.onload = (ev) => this.setState({ logoSrc: ev.target.result });\n          reader.readAsDataURL(file);\n        }\n      },\n      onDownloadPDF: () => {\n        const pdfData = {\n          brandColor: s.brandColor,\n          logoSrc: s.logoSrc,\n          avatarShape: s.avatarShape || 'circle',\n          projectTitle: s.projectTitle || 'Proposta Comercial',\n          projectDate: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }),\n          designerName: s.designerName,\n          designerRole: s.designerRole,\n          catResumo: s.catResumo,\n          catEscopo: s.catEscopo,\n          catTimeline: s.catTimeline,\n          catInvestimento: s.catInvestimento,\n          catExcluido: s.catExcluido,\n          catPerguntas: s.catPerguntas\n        };\n        localStorage.setItem('briefly_pdf_data', JSON.stringify(pdfData));\n        window.open('Briefly Proposta PDF.dc.html', '_blank');\n      },\n      showAudioRecorder: s.showAudioRecorder,\n      isRecording: s.isRecording,\n      isTranscribing: s.isTranscribing,\n      showRecordBtn: !s.isRecording && !s.isTranscribing,\n      recordTime: s.recordTime || '0:00',\n      audioLabel: s.showAudioRecorder ? 'Fechar' : 'Áudio',\n      audioBtnColor: s.showAudioRecorder ? 'var(--accent-primary)' : 'var(--text-secondary)',\n      audioBorder: s.isRecording ? '#dc2626' : 'var(--border-default)',\n      onToggleAudio: () => this.setState({ showAudioRecorder: !s.showAudioRecorder }),\n      onStartRecording: async () => {\n        try {\n          const maxSec = s.isPremium ? 300 : 60;\n          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n          const mr = new MediaRecorder(stream);\n          const chunks = [];\n          mr.ondataavailable = (e) => chunks.push(e.data);\n          mr.onstop = async () => {\n            stream.getTracks().forEach(t => t.stop());\n            clearInterval(this._recInterval);\n            this.setState({ isRecording: false, isTranscribing: true });\n            const blob = new Blob(chunks, { type: 'audio/webm' });\n            // Use browser SpeechRecognition\n            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {\n              const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n              const recognition = new SR();\n              recognition.lang = 'pt-BR';\n              recognition.continuous = true;\n              recognition.interimResults = false;\n              let transcript = '';\n              recognition.onresult = (ev) => {\n                for (let i = ev.resultIndex; i < ev.results.length; i++) {\n                  transcript += ev.results[i][0].transcript + ' ';\n                }\n              };\n              recognition.onend = () => {\n                const msg = s.clientMessage ? s.clientMessage + '\\n\\n' + transcript.trim() : transcript.trim();\n                this.setState({ clientMessage: msg, isTranscribing: false });\n              };\n              recognition.onerror = () => {\n                this.setState({ isTranscribing: false, errorMsg: 'Erro na transcrição. Tente digitar.' });\n              };\n              // Play blob to trigger recognition\n              const audio = new Audio(URL.createObjectURL(blob));\n              recognition.start();\n              audio.play();\n              audio.onended = () => setTimeout(() => recognition.stop(), 1000);\n            } else {\n              this.setState({ isTranscribing: false, errorMsg: 'Navegador não suporta transcrição. Use Chrome.' });\n            }\n          };\n          mr.start();\n          let secs = 0;\n          this._recInterval = setInterval(() => {\n            secs++;\n            const m = Math.floor(secs / 60);\n            const ss = String(secs % 60).padStart(2, '0');\n            this.setState({ recordTime: `${m}:${ss}` });\n            if (secs >= maxSec) mr.stop();\n          }, 1000);\n          this.setState({ isRecording: true, recordTime: '0:00', mediaRecorder: mr });\n        } catch(e) {\n          this.setState({ errorMsg: 'Permita o acesso ao microfone.' });\n        }\n      },\n      onStopRecording: () => {\n        if (s.mediaRecorder && s.mediaRecorder.state !== 'inactive') s.mediaRecorder.stop();\n      },\n      levelOptions: [\n        { id: 'junior', label: 'Júnior', sub: '0–2 anos', border: s.designerLevel === 'junior' ? 'var(--accent-primary)' : 'var(--border-default)', bg: s.designerLevel === 'junior' ? 'var(--accent-25)' : 'var(--bg-sunken)', textColor: s.designerLevel === 'junior' ? 'var(--accent-primary)' : 'var(--text-primary)', subColor: s.designerLevel === 'junior' ? 'var(--accent-primary)' : 'var(--text-secondary)', onClick: () => this.setState({ designerLevel: 'junior' }) },\n        { id: 'pleno', label: 'Pleno', sub: '2–5 anos', border: s.designerLevel === 'pleno' ? 'var(--accent-primary)' : 'var(--border-default)', bg: s.designerLevel === 'pleno' ? 'var(--accent-25)' : 'var(--bg-sunken)', textColor: s.designerLevel === 'pleno' ? 'var(--accent-primary)' : 'var(--text-primary)', subColor: s.designerLevel === 'pleno' ? 'var(--accent-primary)' : 'var(--text-secondary)', onClick: () => this.setState({ designerLevel: 'pleno' }) },\n        { id: 'senior', label: 'Sênior', sub: '5+ anos', border: s.designerLevel === 'senior' ? 'var(--accent-primary)' : 'var(--border-default)', bg: s.designerLevel === 'senior' ? 'var(--accent-25)' : 'var(--bg-sunken)', textColor: s.designerLevel === 'senior' ? 'var(--accent-primary)' : 'var(--text-primary)', subColor: s.designerLevel === 'senior' ? 'var(--accent-primary)' : 'var(--text-secondary)', onClick: () => this.setState({ designerLevel: 'senior' }) }\n      ],\n      onMessageChange: (e) => this.setState({ clientMessage: e.target.value, errorMsg: '' }),\n      onDesignerNameChange: (e) => this.setState({ designerName: e.target.value }),\n      onDesignerRoleChange: (e) => this.setState({ designerRole: e.target.value }),\n      projectTitle: s.projectTitle || 'Proposta comercial',\n      projectDate: new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' }),\n      catResumo: s.catResumo || '',\n      catEscopo: s.catEscopo || '',\n      catTimeline: s.catTimeline || '',\n      catInvestimento: s.catInvestimento || '',\n      catExcluido: s.catExcluido || '',\n      catPerguntas: s.catPerguntas || '',\n      brandColorLight: s.brandColor + '10',\n      brandColorBorder: s.brandColor + '25',\n      designerInitials: (s.designerName || 'B').split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase(),\n      onCopyAll: () => {\n        const full = `RESUMO\\n${s.catResumo}\\n\\nESCOPO E ENTREGÁVEIS\\n${s.catEscopo}\\n\\nPRAZO E ETAPAS\\n${s.catTimeline}\\n\\nINVESTIMENTO\\n${s.catInvestimento}\\n\\nO QUE NÃO ESTÁ INCLUÍDO\\n${s.catExcluido}\\n\\nPERGUNTAS\\n${s.catPerguntas}`;\n        navigator.clipboard.writeText(full);\n        this.setState({ copyLabel: 'Copiado!' });\n        setTimeout(() => this.setState({ copyLabel: 'Copiar tudo' }), 2000);\n      },\n      onGenerate: async () => {\n        if (isLoading) return;\n        if (!s.clientMessage.trim()) { this.setState({ errorMsg: 'Cole a mensagem do cliente primeiro.' }); return; }\n        if (s.clientMessage.trim().length < 20) { this.setState({ errorMsg: 'Mensagem muito curta. Cole o texto completo do cliente.' }); return; }\n        const maxU = s.isPremium ? 50 + (s.extras || 0) : 5;\n        if (s.usage >= maxU) {\n          if (!s.isPremium) { this.setState({ showUpgrade: true }); return; }\n          else { this.setState({ errorMsg: 'Limite de 50 propostas/mês atingido. Compre um pacote extra.' }); return; }\n        }\n\n        this.setState({ status: 'loading', errorMsg: '' });\n\n        try {\n          const systemPrompt = `Você é o Briefly, um assistente especializado em transformar mensagens bagunçadas de clientes em propostas comerciais estruturadas para designers brasileiros.\n\nResponda SEMPRE em português brasileiro. Profissional, direto e preciso.\n\nO designer se chama ${s.designerName || 'o designer'} e é ${s.designerRole || 'Designer'}.\nNível de experiência: ${s.designerLevel === 'junior' ? 'Júnior (0-2 anos) — preços de entrada do mercado' : s.designerLevel === 'pleno' ? 'Pleno (2-5 anos) — preços médios do mercado' : 'Sênior (5+ anos) — preços premium do mercado'}.\nAjuste os valores sugeridos de acordo com o nível do designer no mercado brasileiro.\n\nAo receber a mensagem do cliente, gere EXATAMENTE 7 blocos separados por \"---SEP---\":\n\nBLOCO 1 - TÍTULO DO PROJETO:\nUma linha curta com o nome do projeto (ex: \"Landing Page — Studio XYZ\", \"Branding Completo — Café Aurora\")\n\nBLOCO 2 - RESUMO DO PROJETO:\nFormato EXATO (cada item em uma linha):\nTipo: [tipo do projeto]\nObjetivo: [objetivo em 1 frase]\nPúblico-alvo: [público]\nPlataforma: [ferramenta recomendada]\nObservações: [notas relevantes]\n\nBLOCO 3 - ESCOPO E ENTREGÁVEIS:\nListe cada entregável em uma linha no formato:\n- [Nome do entregável] | [Descrição curta]\nExemplo:\n- Design UI/UX | 5 telas responsivas no Figma\n- Protótipo interativo | Navegação entre telas\n- Guia de estilo | Cores, tipografia e componentes\n\nBLOCO 4 - PRAZO E ETAPAS:\nListe cada etapa em uma linha no formato:\n[Número]. [Nome da Etapa] | [Duração] | [Descrição curta]\nExemplo:\n1. Briefing e Pesquisa | 2 dias | Alinhamento de expectativas e referências\n2. Wireframe | 3 dias | Estrutura e fluxo das telas\n3. Design Visual | 5 dias | Interface final com identidade visual\n4. Revisões | 3 dias | Até 2 rodadas de ajustes\n5. Entrega Final | 1 dia | Arquivos organizados e handoff\n\nBLOCO 5 - INVESTIMENTO:\nFormato EXATO:\nSERVICOS:\n[Nome do serviço] | R$ [valor]\n[Nome do serviço] | R$ [valor]\nTOTAL: R$ [valor total]\nDESCONTO: [percentual se aplicável, senão \"0%\"]\nFINAL: R$ [valor final com desconto]\nPAGAMENTO: [condições - ex: 50% entrada + 50% entrega]\nPARCELAMENTO: [opção de parcelamento - ex: ou 3x de R$ X]\n\nBLOCO 6 - O QUE NÃO ESTÁ INCLUÍDO:\nListe cada item em uma linha com \"- \" no início:\n- Hospedagem e domínio\n- Produção de conteúdo/copy\n- Fotografias profissionais\n(etc)\n\nBLOCO 7 - PERGUNTAS PARA O CLIENTE:\n3-5 perguntas, cada uma em uma linha com número:\n1. [Pergunta]\n2. [Pergunta]\n(etc)`;\n\n          const result = await window.claude.complete({\n            system: systemPrompt,\n            messages: [{ role: 'user', content: `Mensagem do cliente:\\n\\n${s.clientMessage}` }],\n            max_tokens: 4000\n          });\n\n          // Flexible parsing: try ---SEP--- first, then BLOCO headers\n          let parts;\n          if (result.includes('---SEP---')) {\n            parts = result.split('---SEP---');\n          } else {\n            // Split by BLOCO N pattern\n            parts = result.split(/BLOCO\\s*\\d+\\s*[-–—:]\\s*/i).filter(p => p.trim());\n            // If that didn't work, try numbered headers\n            if (parts.length < 3) {\n              parts = result.split(/\\n(?=\\d+\\s*[-–—.]\\s*[A-ZÁÉÍÓÚÀÃÕÇ])/i);\n            }\n          }\n          // Clean headers from each part\n          parts = parts.map(p => p.replace(/^(TÍTULO DO PROJETO|RESUMO DO PROJETO|ESCOPO E ENTREGÁVEIS|PRAZO E ETAPAS|INVESTIMENTO|O QUE NÃO ESTÁ INCLUÍDO|PERGUNTAS PARA O CLIENTE)\\s*[:\\n]*/i, '').trim());\n          const projectTitle = (parts[0] || 'Proposta').trim();\n          const catResumo = (parts[1] || '').trim();\n          const catEscopo = (parts[2] || '').trim();\n          const catTimeline = (parts[3] || '').trim();\n          const catInvestimento = (parts[4] || '').trim();\n          const catExcluido = (parts[5] || '').trim();\n          const catPerguntas = (parts[6] || '').trim();\n\n          // Auto-detect category\n          const allText = (projectTitle + ' ' + catResumo + ' ' + catEscopo).toLowerCase();\n          let category = 'Outros';\n          if (/landing\\s*page|site|website|página|loja virtual|e-?commerce/.test(allText)) category = 'Web Design';\n          else if (/brand|marca|logo|identidade visual|papelaria/.test(allText)) category = 'Branding';\n          else if (/social|instagram|tiktok|post|feed|stories|reels|carrossel/.test(allText)) category = 'Social Media';\n          else if (/app|aplicativo|mobile|tela|interface|ux|ui|dashboard/.test(allText)) category = 'UI/UX';\n          else if (/vídeo|video|motion|animação|edição/.test(allText)) category = 'Vídeo';\n          else if (/email|newsletter|e-mail marketing/.test(allText)) category = 'Email Marketing';\n          else if (/apresentação|pitch|deck|slide|powerpoint/.test(allText)) category = 'Apresentação';\n          else if (/arte|banner|flyer|cartaz|panfleto|convite/.test(allText)) category = 'Arte Gráfica';\n\n          const newUsage = s.usage + 1;\n          const now2 = new Date();\n          const mk = `${now2.getFullYear()}-${now2.getMonth()}`;\n          localStorage.setItem('briefly_monthly', JSON.stringify({ month: mk, count: newUsage }));\n          const newHistory = [\n            { title: projectTitle.substring(0, 40), date: new Date().toLocaleDateString('pt-BR'),\n              category,\n              brief: catResumo, proposal: catEscopo + '\\n\\n' + catTimeline + '\\n\\n' + catInvestimento,\n              questions: catPerguntas,\n              projectTitle, catResumo, catEscopo, catTimeline, catInvestimento, catExcluido, catPerguntas },\n            ...s.history\n          ].slice(0, 10);\n\n          localStorage.setItem('briefly_history', JSON.stringify(newHistory));\n          localStorage.setItem('briefly_usage', String(newUsage));\n\n          const showUpgrade = !s.isPremium && newUsage >= 5;\n          this.setState({\n            status: 'done',\n            projectTitle, catResumo, catEscopo, catTimeline, catInvestimento, catExcluido, catPerguntas,\n            briefContent: catResumo,\n            proposalContent: catEscopo,\n            questionsContent: catPerguntas,\n            history: newHistory,\n            usage: newUsage,\n            showUpgrade\n          });\n        } catch(e) {\n          this.setState({ status: 'idle', errorMsg: 'Erro ao gerar. Tente novamente.' });\n        }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
