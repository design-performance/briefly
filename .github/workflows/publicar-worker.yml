name: Publicar servidor (Cloudflare)

# Sempre que o código do servidor (pasta worker/) muda no GitHub,
# este robô publica a versão nova no Worker da Cloudflare.
# A chave fica guardada em Settings > Secrets > CLOUDFLARE_API_TOKEN
# e só consegue publicar este Worker.

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/publicar-worker.yml'
  workflow_dispatch:

concurrency:
  group: publicar-worker
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publicar na Cloudflare
        working-directory: worker
        env:
          CHAVE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5dfafa477cb2604db1931690e3302ed6
        run: |
          # Aceita a chave pura ou colada junto com o exemplo (ex: "Bearer xxxxx"):
          # pega só o código, sem espaços, aspas ou texto em volta.
          T=$(printf '%s' "$CHAVE" | grep -oE '(Bearer[[:space:]]+|TOKEN=)[A-Za-z0-9_-]{20,}' | grep -oE '[A-Za-z0-9_-]{20,}$' | head -1 || true)
          if [ -z "$T" ]; then T=$(printf '%s' "$CHAVE" | grep -oE '[A-Za-z0-9_-]{30,}' | head -1 || true); fi
          echo "Chave com ${#T} caracteres."
          export CLOUDFLARE_API_TOKEN="$T"
          npx --yes wrangler@4.162.0 deploy
